name: "EvalOps Evaluate PR"
description: "Run an EvalOps suite against a PR, post the verdict as a comment, and upload JUnit results."

inputs:
  suite-id:
    description: "UUID of the simulation suite to run (alternative to suite-name)"
    required: false
  suite-name:
    description: "Name of the simulation suite to run (alternative to suite-id)"
    required: false
  org-id:
    description: "UUID of your EvalOps organization"
    required: true
  api-key:
    description: "EVALOPS_API_KEY (JWT token). Set via secrets."
    required: true
  api-url:
    description: "Base URL of your EvalOps instance"
    required: false
    default: "http://localhost:3000"
  fail-on-warn:
    description: "Exit with non-zero code on warnings (true/false)"
    required: false
    default: "false"
  output-dir:
    description: "Directory to write JUnit XML and JSON summary"
    required: false
    default: "test-results"
  enable-pr-decoration:
    description: "Call the Enterprise PR-decoration endpoint after the gate runs (requires a valid EvalOps Enterprise license on the target server; silently skipped if not entitled)"
    required: false
    default: "false"

outputs:
  decision:
    description: "Overall verdict: pass | warn | fail"
    value: ${{ steps.run-eval.outputs.decision }}
  pass-rate:
    description: "Pass rate as a decimal (0–1)"
    value: ${{ steps.run-eval.outputs.pass_rate }}
  report-path:
    description: "Path to the JUnit XML report"
    value: ${{ steps.run-eval.outputs.report_path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Run evaluation suite
      id: run-eval
      shell: node {0}
      env:
        EVALOPS_API_KEY: ${{ inputs.api-key }}
        EVALOPS_API_URL: ${{ inputs.api-url }}
        INPUT_SUITE_ID: ${{ inputs.suite-id }}
        INPUT_SUITE_NAME: ${{ inputs.suite-name }}
        INPUT_ORG_ID: ${{ inputs.org-id }}
        INPUT_FAIL_ON_WARN: ${{ inputs.fail-on-warn }}
        INPUT_OUTPUT_DIR: ${{ inputs.output-dir }}
        INPUT_ENABLE_PR_DECORATION: ${{ inputs.enable-pr-decoration }}
        GITHUB_OUTPUT: ${{ env.GITHUB_OUTPUT }}
      run: ${{ github.action_path }}/run.js

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        EVAL_DECISION: ${{ steps.run-eval.outputs.decision }}
        EVAL_PASS_RATE: ${{ steps.run-eval.outputs.pass_rate }}
        EVAL_SUITE_NAME: ${{ steps.run-eval.outputs.suite_name }}
        EVAL_TOTAL: ${{ steps.run-eval.outputs.total_scenarios }}
        EVAL_PASSED: ${{ steps.run-eval.outputs.passed }}
        EVAL_WARNED: ${{ steps.run-eval.outputs.warned }}
        EVAL_FAILED: ${{ steps.run-eval.outputs.failed }}
      with:
        script: |
          const decision = process.env.EVAL_DECISION;
          const passRate = parseFloat(process.env.EVAL_PASS_RATE || '0');
          const suiteName = process.env.EVAL_SUITE_NAME || 'Unknown';
          const total = parseInt(process.env.EVAL_TOTAL || '0');
          const passed = parseInt(process.env.EVAL_PASSED || '0');
          const warned = parseInt(process.env.EVAL_WARNED || '0');
          const failed = parseInt(process.env.EVAL_FAILED || '0');

          const icon = decision === 'pass' ? '✅' : decision === 'warn' ? '⚠️' : '❌';
          const passRatePct = (passRate * 100).toFixed(1);

          const body = [
            `## ${icon} EvalOps Quality Gate — ${decision.toUpperCase()}`,
            ``,
            `**Suite:** ${suiteName}`,
            ``,
            `| Metric | Value |`,
            `|--------|-------|`,
            `| Pass rate | ${passRatePct}% |`,
            `| Scenarios | ${total} total (${passed} pass, ${warned} warn, ${failed} fail) |`,
            `| Verdict | **${decision}** |`,
            ``,
            `<details><summary>View full results</summary>`,
            ``,
            `JUnit XML and JSON summary are available as workflow artifacts.`,
            `</details>`,
          ].join('\n');

          const { data: comments } = await github.rest.issues.listComments({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: context.issue.number,
          });

          const existing = comments.find(c =>
            c.user?.login === 'github-actions[bot]' &&
            c.body?.includes('EvalOps Quality Gate')
          );

          if (existing) {
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: existing.id,
              body,
            });
          } else {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
          }

    - name: Upload JUnit results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: evalops-results
        path: ${{ inputs.output-dir }}/
        if-no-files-found: warn
