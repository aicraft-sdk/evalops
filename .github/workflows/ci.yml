name: CI/CD

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DOCKER_REGISTRY: ghcr.io/${{ github.repository_owner }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Lint (affected)
        run: npx nx affected --target=lint --base=origin/main --head=HEAD

  # ────────────────────────────────────────────────────────────────────────────
  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit --project tsconfig.base.json || true

  # ────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evalops_test
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://evalops:test_password@localhost:5432/evalops_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-key-32chars-minimum
      SERVICE_SECRET: ci-service-secret
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Test (affected)
        run: npx nx affected --target=test --base=origin/main --head=HEAD --coverage

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}

      - name: Build (affected)
        run: npx nx affected --target=build --base=origin/main --head=HEAD

  # ────────────────────────────────────────────────────────────────────────────
  simulation-gates:
    name: Simulation Gates
    runs-on: ubuntu-latest
    needs: [build]
    if: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: evalops_test
          POSTGRES_USER: evalops
          POSTGRES_PASSWORD: test_password
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://evalops:test_password@localhost:5432/evalops_test
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-key-32chars-minimum
      SERVICE_SECRET: ci-service-secret
      EVALOPS_API_URL: http://localhost:3000
      GITHUB_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore Nx cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Run database migrations
        run: npm run db:push
        env:
          DATABASE_URL: postgresql://evalops:test_password@localhost:5432/evalops_test

      - name: Start services in background
        run: |
          npm run dev:gateway > /tmp/gateway.log 2>&1 &
          GATEWAY_PID=$!
          npm run dev:auth > /tmp/auth.log 2>&1 &
          AUTH_PID=$!
          npm run dev:core > /tmp/core.log 2>&1 &
          CORE_PID=$!
          npm run dev:evaluation > /tmp/evaluation.log 2>&1 &
          EVALUATION_PID=$!
          npm run dev:integration > /tmp/integration.log 2>&1 &
          INTEGRATION_PID=$!
          npm run dev:analytics > /tmp/analytics.log 2>&1 &
          ANALYTICS_PID=$!
          echo "Started services: gateway=$GATEWAY_PID, auth=$AUTH_PID, core=$CORE_PID, evaluation=$EVALUATION_PID, integration=$INTEGRATION_PID, analytics=$ANALYTICS_PID"
          echo "GATEWAY_PID=$GATEWAY_PID" >> $GITHUB_ENV
          echo "AUTH_PID=$AUTH_PID" >> $GITHUB_ENV
          echo "CORE_PID=$CORE_PID" >> $GITHUB_ENV
          echo "EVALUATION_PID=$EVALUATION_PID" >> $GITHUB_ENV
          echo "INTEGRATION_PID=$INTEGRATION_PID" >> $GITHUB_ENV
          echo "ANALYTICS_PID=$ANALYTICS_PID" >> $GITHUB_ENV
        env:
          DATABASE_URL: postgresql://evalops:test_password@localhost:5432/evalops_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          JWT_SECRET: ci-test-secret-key-32chars-minimum
          SERVICE_SECRET: ci-service-secret

      - name: Wait for services to be ready
        run: |
          echo "Waiting for services to start..."
          timeout=120
          for i in $(seq 1 $timeout); do
            if curl -sf http://localhost:3000/health > /dev/null 2>&1 && \
               curl -sf http://localhost:3001/health > /dev/null 2>&1 && \
               curl -sf http://localhost:3002/health > /dev/null 2>&1 && \
               curl -sf http://localhost:3003/health > /dev/null 2>&1; then
              echo "All services are ready"
              break
            fi
            echo "Waiting... ($i/$timeout)"
            sleep 1
          done
          if ! curl -sf http://localhost:3000/health > /dev/null 2>&1; then
            echo "Services failed to start. Logs:"
            echo "=== Gateway ==="
            tail -50 /tmp/gateway.log || true
            echo "=== Auth ==="
            tail -50 /tmp/auth.log || true
            echo "=== Core ==="
            tail -50 /tmp/core.log || true
            echo "=== Evaluation ==="
            tail -50 /tmp/evaluation.log || true
            exit 1
          fi

      - name: Run simulation suite
        run: |
          if [ -z "${{ secrets.EVALOPS_SIMULATION_SUITE_ID }}" ]; then
            echo "EVALOPS_SIMULATION_SUITE_ID secret not set, skipping simulation gates"
            exit 0
          fi
          if [ -z "${{ secrets.EVALOPS_API_KEY }}" ]; then
            echo "EVALOPS_API_KEY secret not set, skipping simulation gates"
            exit 0
          fi
          npx nx run evaluation-service:run-suite \
            --suite-id=${{ secrets.EVALOPS_SIMULATION_SUITE_ID }} \
            --org-id=${{ secrets.EVALOPS_ORG_ID }} \
            --fail-on-warn=true \
            --output-format=junit \
            --output-dir=./test-results \
            --commit-sha=${{ github.sha }}
        env:
          EVALOPS_API_KEY: ${{ secrets.EVALOPS_API_KEY }}
          EVALOPS_API_URL: http://localhost:3000
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload JUnit results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulation-results
          path: ./test-results/*.xml
          retention-days: 7

      - name: Stop services
        if: always()
        run: |
          kill $GATEWAY_PID $AUTH_PID $CORE_PID $EVALUATION_PID $INTEGRATION_PID $ANALYTICS_PID 2>/dev/null || true

  # ────────────────────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        service:
          - api-gateway
          - auth-service
          - core-service
          - evaluation-service
          - integration-service
          - analytics-service
          - frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/evalops/${{ matrix.service }}
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > kubeconfig.yaml
          echo "KUBECONFIG=$PWD/kubeconfig.yaml" >> $GITHUB_ENV

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy with Helm
        run: |
          helm upgrade --install evalops ./helm/evalops \
            --namespace evalops \
            --create-namespace \
            -f ./helm/evalops/values.production.yaml \
            --set image.tag=${{ github.sha }} \
            --timeout 10m \
            --wait

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/evalops-api-gateway -n evalops
          kubectl rollout status deployment/evalops-core-service -n evalops
