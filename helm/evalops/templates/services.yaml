{{- $services := dict
  "auth-service" (dict "port" .Values.services.authService.port "replicas" .Values.replicaCount.authService "otelName" "auth-service")
  "core-service" (dict "port" .Values.services.coreService.port "replicas" .Values.replicaCount.coreService "otelName" "core-service")
  "evaluation-service" (dict "port" .Values.services.evaluationService.port "replicas" .Values.replicaCount.evaluationService "otelName" "evaluation-service")
-}}
{{- range $name, $svc := $services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app: {{ $name }}
    release: {{ $.Release.Name }}
spec:
  replicas: {{ $svc.replicas }}
  selector:
    matchLabels:
      app: {{ $name }}
  template:
    metadata:
      labels:
        app: {{ $name }}
        release: {{ $.Release.Name }}
    spec:
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.global.imageRegistry }}evalops/{{ $name }}:{{ $.Values.image.tag }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ $.Release.Name }}-config
            - secretRef:
                name: {{ $.Values.secretName }}
          env:
            - name: OTEL_SERVICE_NAME
              value: {{ $svc.otelName | quote }}
          livenessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: {{ $svc.port }}
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $name }}
  labels:
    app: {{ $name }}
    release: {{ $.Release.Name }}
spec:
  selector:
    app: {{ $name }}
  ports:
    - port: {{ $svc.port }}
      targetPort: {{ $svc.port }}
{{- end }}
